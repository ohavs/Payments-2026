name: CI

# Lint, unit tests and a production build on every branch except the served
# one (deploy.yml runs the same checks there before deploying).
on:
  push:
    branches-ignore:
      - claude/implement-payments-page-G9fij
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
