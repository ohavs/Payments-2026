name: Deploy to Firebase Hosting

# Every push to the served branch redeploys the site (and Firestore rules)
# automatically. Can also be triggered by hand from the Actions tab.
on:
  push:
    branches:
      - claude/implement-payments-page-G9fij
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service account key
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy hosting + Firestore rules
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore:rules,firestore:indexes --project schedual-fdde7 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
