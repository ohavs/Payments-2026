name: Deploy to Firebase Hosting

# Every push to the served branch redeploys the site (and Firestore rules)
# automatically. Can also be triggered by hand from the Actions tab.
on:
  push:
    branches:
      - claude/implement-payments-page-G9fij
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install, test and build
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Write service account key
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Hosting deploys first and on its own, so the live app always updates —
      # a Firestore-rules permission hiccup can never block the site itself.
      - name: Deploy hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project schedual-fdde7 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

      # Open the live site in a real browser and make sure it boots.
      - name: Smoke-test the live site
        run: |
          npm i --no-save playwright@1.64.0
          npx playwright install --with-deps chromium
          node scripts/smoke-live.mjs https://schedual-fdde7.web.app/

      # Rules deploy separately. If this step fails (e.g. IAM still propagating),
      # the app is already live; just re-run the job once rules can deploy.
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project schedual-fdde7 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
