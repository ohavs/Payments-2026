name: Android

# Builds the signed APK on every push. On the served branch it also publishes a
# GitHub Release, which the app's "check for updates" installs from — but only
# when something that ships in the APK changed since the last release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Release key fingerprint. Android only installs an update signed by the same
  # key, so a build signed with anything else must never be published.
  CERT_SHA256: dc8b1cefd14826bd994d343b338d1c79500e7d3ad416656ff5e4229a74725c0b

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.v.outputs.code }}
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build web and sync into Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Version
        id: v
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=$BASE.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ steps.v.outputs.code }} -PversionName=${{ steps.v.outputs.name }}
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Check signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -qi "SHA-256 digest: $CERT_SHA256" certs.txt
          cp "$APK" payments.apk
          sha256sum payments.apk | cut -d' ' -f1 > payments.apk.sha256
          BADGING=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          "$BADGING" dump badging payments.apk | grep -E "^package|uses-permission|targetSdk"
          unzip -l payments.apk | grep -q "assets/public/index.html"

      - uses: actions/upload-artifact@v5
        with:
          name: payments-${{ steps.v.outputs.name }}
          path: |
            payments.apk
            payments.apk.sha256

  # Boot the APK on an emulator and check the app renders its first screen.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: payments-*
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android-smoke.sh payments.apk
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-smoke
          path: |
            android-smoke.png
            ui.xml

  # Publish only after the APK booted on the emulator, and only from the served
  # branch. The app's "check for updates" reads the latest release.
  release:
    needs: [apk, smoke]
    if: github.ref_name == 'claude/implement-payments-page-G9fij'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: payments-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          SHIPPED="src public index.html android package.json package-lock.json capacitor.config.json"
          if [ -n "$LAST" ] && git diff --quiet "$LAST" HEAD -- $SHIPPED ':(exclude)src/**/*.test.js'; then
            echo "Nothing in the app changed since $LAST; no release."; exit 0
          fi
          if [ -z "$LAST" ] || ! git diff --quiet "$LAST" HEAD -- release-notes.md; then
            cp release-notes.md notes.md
          else
            echo "- שיפורים ותיקונים" > notes.md
          fi
          printf '\n<!-- update {"versionCode":%s,"sha256":"%s","apk":"payments.apk"} -->\n' \
            "${{ needs.apk.outputs.code }}" "$(cat payments.apk.sha256)" >> notes.md
          gh release create "v${{ needs.apk.outputs.name }}" payments.apk \
            --target "$GITHUB_SHA" --title "גרסה ${{ needs.apk.outputs.name }}" --notes-file notes.md --latest
